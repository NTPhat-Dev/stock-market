<mat-toolbar class="app-toolbar">
  <button
    matButton
    class="menu-button"
    (click)="sidenav.toggle()"
    aria-label="Mở hoặc đóng menu"
    [attr.aria-expanded]="sidenav.opened"
  >
    ☰
  </button>
  <a class="brand" routerLink="/labs">Stock Market<span>Thực hành Angular</span></a>
  <span class="toolbar-spacer"></span>
  <nav aria-label="Menu ngang" class="top-nav">
    <a matButton class="stocks-link" routerLink="/stocks" routerLinkActive="active-link"
      >Cổ phiếu</a
    >
    @if (users.user(); as user) {
      <span class="username">{{ user.username }}</span
      ><button matButton (click)="logout()">Đăng xuất</button>
    } @else {
      <a matButton routerLink="/login" routerLinkActive="active-link">Đăng nhập</a>
      <a matButton routerLink="/register" routerLinkActive="active-link">Đăng ký</a>
    }
  </nav>
</mat-toolbar>
<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="over" class="side-menu">
    <h2 class="side-heading">Bài thực hành</h2>
    <nav aria-label="Menu dọc" class="side-links">
      @for (link of links; track link.path) {
        <a
          matButton
          [routerLink]="link.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="sidenav.close()"
          >{{ link.title }}</a
        >
      }
      <a matButton routerLink="/login" (click)="sidenav.close()">Đăng nhập</a>
      <a matButton routerLink="/register" (click)="sidenav.close()">Đăng ký</a>
      <button matButton (click)="sidenav.close()">Đóng menu</button>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <main class="main-content">
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <router-outlet />
    </main>
    <footer>Stock Market · Bài thực hành 3–9</footer>
  </mat-sidenav-content>
</mat-sidenav-container>
